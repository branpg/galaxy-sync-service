name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Install Fyne dependencies
        run: |
          choco install mingw -y
          
      - name: Download dependencies
        run: go mod download
      
      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      
      - name: Build Windows executable with icon
        run: |
          fyne package -os windows -icon assets/icon.png -name "Galaxy Sync Service"
        env:
          CGO_ENABLED: 1
          CC: gcc
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            "Galaxy Sync Service.exe"
          draft: false
          prerelease: false
          generate_release_notes: true
