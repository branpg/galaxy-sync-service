name: Release

on:
  push:
    branches:
      - main
    # Also support manual tag releases
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to get all tags for version calculation
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Generate version tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # If triggered by a tag, use that tag
            VERSION="${{ github.ref_name }}"
          else
            # Auto-generate version based on date and short SHA
            VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
      
      - name: Install Fyne dependencies
        run: |
          choco install mingw -y
          
      - name: Download dependencies
        run: go mod download
      
      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      
      - name: Build Windows executable with icon
        run: |
          fyne package -os windows -icon assets/icon.png -name "GalaxySyncService"
          dir *.exe
        env:
          CGO_ENABLED: 1
          CC: gcc
      
      - name: Rename executable
        run: |
          if (Test-Path "GalaxySyncService.exe") {
            Move-Item "GalaxySyncService.exe" "Galaxy-Sync-Service.exe"
          } elseif (Test-Path "galaxy-sync-service.exe") {
            Move-Item "galaxy-sync-service.exe" "Galaxy-Sync-Service.exe"
          }
          dir *.exe
        shell: pwsh
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: Galaxy-Sync-Service.exe
          draft: false
          prerelease: false
          generate_release_notes: true
