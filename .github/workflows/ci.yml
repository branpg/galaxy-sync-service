name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Download dependencies
        run: go mod download
      
      - name: Verify code compiles
        # Check that non-GUI packages compile (GUI requires CGO/mingw for Windows)
        run: go build -v ./internal/config/... ./internal/errors/... ./internal/galaxy/... ./internal/sync/...
      
      - name: Run tests
        # Skip packages that require GUI dependencies (Fyne needs X11/OpenGL)
        run: |
          go test ./internal/config/... ./internal/errors/... ./internal/galaxy/... ./internal/sync/... -v 2>/dev/null || echo "No test files in these packages"
