name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Install Fyne dependencies
        run: |
          choco install mingw -y
          
      - name: Download dependencies
        run: go mod download
      
      - name: Build
        run: go build -ldflags="-H windowsgui" -o galaxy-sync-service.exe .
        env:
          CGO_ENABLED: 1
          CC: gcc
      
      - name: Run tests
        run: go test ./... -v
        env:
          CGO_ENABLED: 1
          CC: gcc
